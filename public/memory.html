<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Nova remembers — MindSpark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .mem-wrap{max-width:1100px;margin:0 auto;padding:30px 22px 80px}
  .mem-wrap h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin-bottom:8px}
  .layers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}
  .layer .big{font-family:var(--display);font-size:2.2rem;font-weight:800;color:var(--lilac);line-height:1}
  .layer h3{font-size:1.05rem;margin:8px 0 4px}
  .layer p{color:var(--muted);font-size:.9rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
  .kv span:first-child{color:var(--muted)}
  .sum{padding:14px;border-radius:14px;background:#07050c;border:1px solid var(--line);margin-top:10px}
  .sum small{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:700}
  td code{font-size:.8rem;word-break:break-word;color:#cfc6e0}
  .tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:rgba(124,58,237,.18);color:var(--lilac);white-space:nowrap}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .scroll{max-height:520px;overflow:auto}
  @media(max-width:820px){.layers,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="mem-wrap" id="mem">
  <div class="loader"><div class="big-orb" aria-hidden="true"></div><p class="muted">Loading memory…</p></div>
</main>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/memory.js"></script>
</body>
</html>
